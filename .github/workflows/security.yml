name: Secure SDLC Pipeline

# Laboratorio: pipeline de SAST + SCA con Semgrep y OWASP Dependency-Check,
# generacion de SBOM y politica de fallo del build por severidad.
#
#   SAST (Semgrep) ──┐
#                    ├──► Security Gate ──► Build (imagen Docker)
#   SCA  (Dep-Check) ┘        ▲
#   SBOM (Syft) ──────────────┘ (el build tambien espera al SBOM)
#
# SAST y SCA YA NO usan `continue-on-error`: publican sus reportes y el job
# `security-gate` aplica policies/security-policy.yml. Si se supera un umbral,
# el gate termina con exit 1 y el job `build` no se ejecuta.
# Secrets, IaC y DAST se mantienen en modo reporte, igual que el repo original.
#
# Cada action esta fijada a un commit SHA inmutable (version en el comentario),
# como en el repo original (OpenSSF Scorecard "Pinned-Dependencies").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab

env:
  DC_VERSION: "12.2.2"     # version de OWASP Dependency-Check (imagen Docker)

jobs:
  # ---------------------------------------------------------------- SAST
  sast:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep
        # pipx evita el bloqueo PEP 668 de pip en ubuntu-24.04
        run: pipx install semgrep
      - name: Run Semgrep
        # Sin --error: Semgrep solo reporta; quien decide es el Security Gate.
        run: |
          mkdir -p reports
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config policies/semgrep-rules.yml \
            --json-output=reports/semgrep.json \
            --sarif-output=reports/semgrep.sarif \
            --metrics=off \
            app/
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # v4 (codeql-bundle-v2.26.1)
        if: always()
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reporte-sast
          path: reports/semgrep.*

  # ---------------------------------------------------------------- Secrets
  secrets:
    name: Secrets · Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required to scan pull_request events
          GITLEAKS_CONFIG: policies/gitleaks.toml

  # ---------------------------------------------------------------- SCA
  sca:
    name: SCA · OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generar package-lock.json (arbol completo, incluye transitivas)
        # El analizador de Node de Dependency-Check necesita el lockfile.
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts
      - name: Cache de la base de datos del NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dc-data
          key: dc-data-${{ env.DC_VERSION }}-${{ github.run_id }}
          restore-keys: dc-data-${{ env.DC_VERSION }}-
      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports ~/dc-data
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/app:/src" \
            -v "$HOME/dc-data:/usr/share/dependency-check/data" \
            -v "$GITHUB_WORKSPACE/reports:/report" \
            "owasp/dependency-check:${DC_VERSION}" \
            --scan /src \
            --project secure-sdlc-pipeline \
            --out /report \
            --format JSON --format HTML --format SARIF \
            --disableOssIndex \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}
          # Sin --failOnCVSS: el umbral lo aplica el Security Gate (politica unica).
          # --disableOssIndex: Sonatype OSS Index ahora exige credenciales.
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # v4 (codeql-bundle-v2.26.1)
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reporte-sca
          path: reports/dependency-check-report.*

  # ---------------------------------------------------------------- IaC
  iac:
    name: IaC · Checkov + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          output_format: sarif   # this action version writes results.sarif to the workspace root
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # v4 (codeql-bundle-v2.26.1)
        if: always()
        with:
          sarif_file: results.sarif
          category: checkov
      - name: Trivy config scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # v4 (codeql-bundle-v2.26.1)
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-iac

  # ---------------------------------------------------------------- SBOM
  sbom:
    name: SBOM · Syft (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generar package-lock.json
        # Sin lockfile Syft solo ve las 2 dependencias directas; con el, todo el arbol.
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./app
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./app
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Resumen del SBOM
        run: |
          {
            echo "### SBOM: $(jq '.components | length' sbom.cyclonedx.json) componentes (CycloneDX)"
            echo "| Componente | Version | PURL |"
            echo "|---|---|---|"
            jq -r '.components[] | "| \(.name) | \(.version) | `\(.purl // "-")` |"' sbom.cyclonedx.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*.json

  # ---------------------------------------------------------------- Security Gate
  security-gate:
    name: Security Gate · politica por severidad
    runs-on: ubuntu-latest
    needs: [sast, sca]
    if: always()           # evalua aunque un escaneo falle (sin reporte = bloqueo)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: descargas
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Aplicar policies/security-policy.yml
        run: |
          pip install pyyaml
          python scripts/security_gate.py \
            --semgrep descargas/reporte-sast/semgrep.json \
            --dependency-check descargas/reporte-sca/dependency-check-report.json \
            --policy policies/security-policy.yml

  # ---------------------------------------------------------------- Build
  build:
    name: Build · imagen Docker
    runs-on: ubuntu-latest
    needs: [security-gate, sbom]   # solo si el gate aprueba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: |
          docker build -t "vulnerable-demo-app:${GITHUB_SHA::7}" app/
          echo "### :white_check_mark: Build generado: vulnerable-demo-app:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- DAST
  dast:
    name: DAST · OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: [sast, sca]   # scan the code before spending time on the running app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the demo app
        run: docker compose up --build -d
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 2
          done
      - name: ZAP baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: policies/zap-rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
